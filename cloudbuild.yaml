steps:
  # 1. Build the API Container
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build API Backend'
    args: 
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/ai-builder-512015/ai-builder-repo/api:$COMMIT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/ai-builder-512015/ai-builder-repo/api:latest'
      - '-f'
      - 'docker/Dockerfile.api'
      - '.' # Keep this as dot so it can see /backend and /sample_data

  # 2. Build the Web Container
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Web Frontend'
    args: 
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/ai-builder-512015/ai-builder-repo/web:$COMMIT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/ai-builder-512015/ai-builder-repo/web:latest'
      - '-f'
      - 'docker/Dockerfile.web'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=http://localhost:8080'
      - '.'

# Push both built images to your specific Artifact Registry
images:
  - 'asia-south1-docker.pkg.dev/ai-builder-512015/ai-builder-repo/api:$COMMIT_SHA'
  - 'asia-south1-docker.pkg.dev/ai-builder-512015/ai-builder-repo/api:latest'
  - 'asia-south1-docker.pkg.dev/ai-builder-512015/ai-builder-repo/web:$COMMIT_SHA'
  - 'asia-south1-docker.pkg.dev/ai-builder-512015/ai-builder-repo/web:latest'

options:
  logging: CLOUD_LOGGING_ONLY
